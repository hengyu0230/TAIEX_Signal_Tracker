name: 更新市場資料

on:
  schedule:
    # GitHub 使用 UTC 時間（台灣時間 = UTC + 8），排程可能延遲數分鐘至數十分鐘
    - cron: "30 7 * * 1-5"   # 台灣 15:30：收盤、外資
    - cron: "45 13 * * 1-5"  # 台灣 21:45：融資
    - cron: "45 14 * * 1-5"  # 台灣 22:45：融資完整數據
    - cron: "30 22 * * 1-5"  # 台灣隔日 06:30：美股收盤
  workflow_dispatch: {}      # 可在 Actions 頁面手動執行

# 預設不給任何權限，只在需要的工作中開放寫入程式庫內容
permissions: {}

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: 抓取資料
        run: node scripts/fetch-data.mjs
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "更新市場資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            # 執行期間若儲存庫有其他更新（例如手動修改檔案），先合併再推送，最多重試 3 次
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "推送失敗，5 秒後重試（第 $i 次）"
              sleep 5
            done
            exit 1
          fi
